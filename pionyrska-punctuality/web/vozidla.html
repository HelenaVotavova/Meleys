<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Helenka, Mario a Luigi</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f2;color:#172126;font:16px system-ui,sans-serif;letter-spacing:0}header{padding:24px;background:#fff;border-bottom:1px solid #ccd3cf}header>div,main{max-width:1100px;margin:auto}h1{margin:3px 0 7px;font-size:29px}.nav{float:right;color:#176149}.sub,.muted{color:#607078}main{padding:24px 20px 50px}.vehicles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.vehicle{background:#fff;border:1px solid #ccd3cf;padding:18px;border-top:5px solid var(--color)}.vehicle h2{margin:0 0 5px;font-size:22px}.vehicle strong{display:block;font-size:24px;margin-top:14px}.online{color:#176149;font-weight:700}.offline{color:#607078}h2{font-size:21px;margin:27px 0 10px}#fleetMap{height:480px;border:1px solid #aeb8b2;background:#e8ece9}.table-wrap{overflow-x:auto;background:#fff;border:1px solid #ccd3cf}table{width:100%;min-width:760px;border-collapse:collapse}th,td{padding:11px 13px;text-align:left;border-bottom:1px solid #e1e5e2}th{font-size:13px;color:#536169;background:#f7f8f6}.badge{display:inline-grid;place-items:center;min-width:72px;height:29px;padding:0 8px;color:#fff;font-weight:800;border-radius:4px}.empty{padding:30px;text-align:center;color:#607078}@media(max-width:700px){header{padding:18px}h1{font-size:24px}.vehicles{grid-template-columns:1fr}#fleetMap{height:390px}}
</style></head><body><header><div><a class="nav" href="/lena.html">Lena</a><h1>Helenka, Mario a Luigi</h1><div class="sub">Společný monitoring tří vozidel DPMB</div></div></header><main><div class="vehicles" id="vehicles"></div><h2>Společná mapa tras</h2><div id="fleetMap"></div><h2>Poslední zaznamenané zastávky</h2><div class="table-wrap"><table><thead><tr><th>Vozidlo</th><th>Linka</th><th>Směr</th><th>Zastávka</th><th>Čas</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty">Čekám na první nasazení sledovaných vozidel.</div></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const fleet=[{id:'19080',name:'Helenka',color:'#c23b62'},{id:'30650',name:'Mario',color:'#b34225'},{id:'30660',name:'Luigi',color:'#176149'}],clock=s=>new Date(s*1000).toLocaleTimeString('cs-CZ',{timeZone:'Europe/Prague',hour:'2-digit',minute:'2-digit',second:'2-digit'});let map,layer;
async function load(){try{const datasets=await Promise.all(fleet.map(async v=>({...v,data:await(await fetch(`/api/vehicle/${v.id}`,{cache:'no-store'})).json()}))),today=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Prague'}).format(new Date()),all=[];document.querySelector('#vehicles').replaceChildren(...datasets.map(v=>{const rows=v.data.records.filter(x=>x.service_date===today),latest=rows.sort((a,b)=>b.last_seen-a.last_seen)[0],online=latest&&Date.now()/1000-latest.last_seen<120,card=document.createElement('section');all.push(...v.data.records.map(x=>({...x,vehicleName:v.name,color:v.color})));card.className='vehicle';card.style.setProperty('--color',v.color);card.innerHTML=`<h2>${v.name}</h2><div class="muted">evidenční ID ${v.id.slice(0,-1)}</div><strong>${latest?`linka ${latest.line}`:'–'}</strong><div>${latest?latest.destination:'dnes bez záznamu'}</div><p class="${online?'online':'offline'}">${online?'právě v provozu':'nyní mimo feed'}</p>`;return card}));if(!map){map=L.map('fleetMap').setView([49.2,16.61],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map)}if(layer)layer.remove();layer=L.featureGroup().addTo(map);const trips=new Map;for(const row of all){if(!row.latitude||!row.longitude)continue;const key=`${row.vehicleName}|${row.service_date}|${row.trip_key}`,points=trips.get(key)||[];points.push(row);trips.set(key,points)}for(const points of trips.values()){points.sort((a,b)=>a.first_seen-b.first_seen);const coords=points.map(x=>[x.latitude,x.longitude]),first=points[0];if(coords.length>1)L.polyline(coords,{color:first.color,weight:4,opacity:.8}).bindPopup(`${first.vehicleName} · linka ${first.line}`).addTo(layer);for(const point of points)L.circleMarker([point.latitude,point.longitude],{radius:4,color:point.color,fillOpacity:.9}).bindTooltip(`${point.vehicleName}: ${point.stop_name}`).addTo(layer)}if(layer.getLayers().length)map.fitBounds(layer.getBounds(),{padding:[20,20]});const recent=all.filter(x=>x.service_date===today).sort((a,b)=>b.first_seen-a.first_seen).slice(0,100);document.querySelector('#rows').replaceChildren(...recent.map(x=>{const tr=document.createElement('tr');tr.innerHTML=`<td><span class="badge" style="background:${x.color}">${x.vehicleName}</span></td><td>${x.line}</td><td>${x.destination}</td><td>${x.stop_name}</td><td>${clock(x.passed_at||x.last_seen)}</td>`;return tr}));document.querySelector('#empty').style.display=recent.length?'none':'block'}catch{document.querySelector('#empty').textContent='Data se nepodařilo načíst.'}}
load();setInterval(load,30000);
</script></body></html>
