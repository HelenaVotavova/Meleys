<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Živé odjezdy · Brno</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f2;color:#172126;font:16px system-ui,sans-serif}header{padding:24px 20px;background:#fff;border-bottom:1px solid #ccd3cf}header>div,main{max-width:980px;margin:auto}h1{margin:3px 0 7px;font-size:29px}.live{color:#176149;font-weight:700}.sub,.meta{color:#607078}.nav{float:right;color:#176149}main{padding:24px 20px 50px}.group{margin-bottom:26px}.group h2{font-size:19px;margin:0 0 8px}.rows{background:#fff;border-top:1px solid #ccd3cf}.row{display:grid;grid-template-columns:70px 90px 1fr auto;gap:14px;align-items:center;padding:13px;border-bottom:1px solid #dfe4e1}.line{display:inline-grid;place-items:center;width:43px;height:31px;background:#087e32;color:#fff;font-weight:800;border-radius:4px}.time{font-size:20px;font-weight:750}.delay{font-weight:700;color:#176149}.late{color:#b34225}.scheduled{color:#607078}.empty{padding:14px;color:#607078}@media(max-width:620px){h1{font-size:24px}.row{grid-template-columns:48px 70px 1fr;gap:8px}.row .state{grid-column:2/4}.time{font-size:17px}}
</style></head><body><header><div><a class="nav" href="/">Všechny analýzy</a><div class="live">Živá data GTFS Realtime</div><h1>Pionýrská a Zahradníkova</h1><div class="sub">Očekávané odjezdy od aktuálního času do +25 minut</div></div></header><main id="groups"><p>Načítám odjezdy…</p></main><script>
const clock=s=>`${String(Math.floor((s%86400)/3600)).padStart(2,'0')}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}`,delay=s=>Math.abs(s)<60?'včas':`${s>0?'+':''}${Math.trunc(s/60)} min`;
async function load(){try{const data=await(await fetch('/api/live-departures',{cache:'no-store'})).json();document.querySelector('#groups').replaceChildren(...data.groups.map(group=>{const section=document.createElement('section');section.className='group';const rows=group.departures.map(x=>`<div class="row"><span class="line">${x.line}</span><span class="time">${clock(x.expected)}</span><span>${x.destination}<br><small>plán ${clock(x.planned)}</small></span><span class="state ${x.live?(x.delay>=60?'late':'delay'):'scheduled'}">${x.live?'živý odhad · '+delay(x.delay):'jízdní řád'}</span></div>`).join('')||'<div class="empty">Žádný odjezd v následujících 25 minutách.</div>';section.innerHTML=`<h2>${group.label}</h2><div class="rows">${rows}</div>`;return section}));}catch{document.querySelector('#groups').textContent='Data se nepodařilo načíst.'}}load();setInterval(load,30000);
</script></body></html>
