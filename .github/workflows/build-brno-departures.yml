name: Build Brno departures Android app
on:
  workflow_dispatch:
  push:
    paths: ["brno-departures-android/**", ".github/workflows/build-brno-departures.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build APK
        run: gradle :app:assembleDebug
        working-directory: brno-departures-android
      - uses: actions/upload-artifact@v4
        with:
          name: BrnoDepartures-debug
          path: brno-departures-android/app/build/outputs/apk/debug/app-debug.apk
