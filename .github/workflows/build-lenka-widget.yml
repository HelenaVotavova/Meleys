name: Build Lenka Android widget
on:
  workflow_dispatch:
  push:
    paths: ["lenka-widget-android/**", ".github/workflows/build-lenka-widget.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle :app:assembleDebug
        working-directory: lenka-widget-android
      - uses: actions/upload-artifact@v4
        with:
          name: LenkaWidget-debug
          path: lenka-widget-android/app/build/outputs/apk/debug/app-debug.apk
