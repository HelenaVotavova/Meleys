name: Build Lenka Android widget
on:
  workflow_dispatch:
  push:
    paths: ["lenka-widget-android/**", ".github/workflows/build-lenka-widget.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build APK
        run: |
          set +e
          gradle :app:assembleDebug > build.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            detail=$(tail -40 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error file=lenka-widget-android/build.log::$detail"
          else
            tail -20 build.log
          fi
          exit "$code"
        working-directory: lenka-widget-android
      - uses: actions/upload-artifact@v4
        with:
          name: LenkaWidget-debug
          path: lenka-widget-android/app/build/outputs/apk/debug/app-debug.apk
