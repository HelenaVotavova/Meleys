name: Build PocketBook Podcast Player
on:
  push:
    paths:
      - "pocketbook-podcast-player-native/**"
      - ".github/workflows/build-pocketbook-podcast-player.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native PocketBook podcast player
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/project" -w /project/pocketbook-podcast-player-native \
            5keeve/pocketbook-sdk:6.3.0-b288-v1 -lc 'set -ex; ./build.sh' 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -40 /tmp/build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=PocketBook compiler::$message"
          fi
          exit "$status"
      - uses: actions/upload-artifact@v4
        with:
          name: HelcinyPodcasty-pocketbook-app
          path: pocketbook-podcast-player-native/build/HelcinyPodcasty.app
