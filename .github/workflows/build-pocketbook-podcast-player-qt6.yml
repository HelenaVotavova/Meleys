name: Build PocketBook Qt6 Audio Test
on:
  push:
    paths:
      - "pocketbook-podcast-player-qt6/**"
      - ".github/workflows/build-pocketbook-podcast-player-qt6.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Qt6 audio test
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/src" -w /src/pocketbook-podcast-player-qt6 \
            ghcr.io/fstanis/pocketbook-sdk-qt6-builder \
            bash -lc '
              set -e
              apt-get update
              apt-get install -y --no-install-recommends qt6-multimedia-dev:armel libasound2-dev:armel libmpg123-dev:armel
              cmake -B build
              cmake --build build -j2
              mkdir -p package/HelcinyPodcastyQt-libs package/HelcinyPodcastyQt-plugins/multimedia
              cp build/HelcinyPodcastyQt.app build/HelcinyPodcastyQt.bin package/
              cp -L /usr/lib/arm-linux-gnueabi/libQt6Multimedia.so.6 package/HelcinyPodcastyQt-libs/
              find /usr/lib/arm-linux-gnueabi/qt6/plugins/multimedia -type f -name "*.so" \
                -exec cp -L {} package/HelcinyPodcastyQt-plugins/multimedia/ \;
              sh ./collect-runtime.sh package
              mkdir -p package/HelcinyAudioWorker-libs package/HelcinyAudioWorker-plugins/multimedia
              cp build/AudioWorkerTest.app build/HelcinyAudioWorker.bin package/
              cp -L /usr/lib/arm-linux-gnueabi/libQt6Core.so.6 package/HelcinyAudioWorker-libs/
              cp -L /usr/lib/arm-linux-gnueabi/libQt6Multimedia.so.6 package/HelcinyAudioWorker-libs/
              find /usr/lib/arm-linux-gnueabi/qt6/plugins/multimedia -type f -name "*.so" \
                -exec cp -L {} package/HelcinyAudioWorker-plugins/multimedia/ \;
              sh ./collect-worker-runtime.sh package
              mkdir -p package/HelcinyAlsaWorker-libs
              cp build/AlsaWorkerTest.app build/HelcinyAlsaWorker.bin package/
              cp -L /usr/lib/arm-linux-gnueabi/libasound.so.2 package/HelcinyAlsaWorker-libs/
              cp -L /usr/lib/arm-linux-gnueabi/libmpg123.so.0 package/HelcinyAlsaWorker-libs/
              sh ./collect-alsa-runtime.sh package
            ' 2>&1 | tee /tmp/pocketbook-build.log || {
              error=$(tail -12 /tmp/pocketbook-build.log | tr '\n' ' ')
              echo "::error::$error"
              exit 1
            }
      - uses: actions/upload-artifact@v4
        with:
          name: HelcinyPodcastyQt-audio-test
          path: pocketbook-podcast-player-qt6/package/
