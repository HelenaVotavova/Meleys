name: Build PocketBook Sokoban

on:
  push:
    paths:
      - "pocketbook-sokoban-native/**"
      - ".github/workflows/build-pocketbook-sokoban.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build native PocketBook Sokoban app
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project/pocketbook-sokoban-native \
            5keeve/pocketbook-sdk:6.3.0-b288-v1 \
            -lc 'set -ex; ./build.sh'

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelcinSokoban-pocketbook-app
          path: pocketbook-sokoban-native/build/HelcinSokoban.app

